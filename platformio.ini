[platformio]
src_dir = src/firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<main_telemetria.cpp> -<motors/teste.cpp> -<testes-bancada/> +<testes-bancada/teste_geral2.cpp>
build_src_filter = +<*> -<main.cpp> -<main_telemetria.cpp> -<testes-bancada/> +<testes-bancada/teste_sensor_proximidade.cpp> -<motors/teste.cpp> -<encoder/test_encoder.cpp>
test_speed = 115200

lib_deps =
  pololu/VL53L0X @ ^1.3.1
  adafruit/Adafruit MPU6050 @ ^2.2.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  bblanchon/ArduinoJson @ ^7.2.0

; pio run -e teste_encoder -t upload
[env:teste_encoder]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<testes-bancada/teste_encoder_motor.cpp>

; pio run -e telemetria -t upload
[env:telemetria]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_src_filter = +<*> -<main.cpp> -<motors/teste.cpp> -<testes-bancada/>
build_src_filter = +<*> -<main.cpp> -<testes-bancada/> -<motors/teste.cpp> -<encoder/test_encoder.cpp>

lib_deps =
  pololu/VL53L0X @ ^1.3.1
  adafruit/Adafruit MPU6050 @ ^2.2.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  bblanchon/ArduinoJson @ ^7.2.0

